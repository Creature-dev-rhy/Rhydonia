l_english:
 RHY_JUR_BOOKMARK_DESC:0 "Jurakya fields disciplined mounted regiments. Develop armored cavalry in place of heavy tanks, balancing inexpensive armor against demanding mount training."
 RHY_GEH_BOOKMARK_DESC:0 "Gehirnstahl workshops equip heavy infantry. Establish a land research facility and develop mechanical walkers."
 RHY_UHT_BOOKMARK_DESC:0 "The Hasharan tribes pursue Carapacian aviation. Conventional light and medium aircraft give way to an ornithopter project and three specialized research branches."
